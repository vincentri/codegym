# Checks every change: formatting, lint, types and tests for the UI and the Rust crates
# (including every built-in problem in every language), the macOS runner under the app's
# signature, and the Docker image.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main runs this through release.yml
  workflow_dispatch:
  workflow_call:

# Newer pushes to a branch cancel its older runs; runs on main (releases) always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  python-wasi:
    uses: ./.github/workflows/python-wasi.yml

  frontend:
    name: UI (check + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, lint and type check
        working-directory: apps/desktop
        run: pnpm exec vp check
      - name: Tests
        working-directory: apps/desktop
        run: pnpm exec vp test run

  rust:
    name: Rust (clippy + tests)
    needs: python-wasi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install system libraries (WebKitGTK for Tauri, D-Bus for the keychain)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libdbus-1-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      # Java solutions need a JDK; g++ and rustc are already on the runner.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The desktop crate embeds the built UI, so it has to exist before the crate compiles.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the UI
        working-directory: apps/desktop
        run: pnpm build

      - uses: actions/download-artifact@v8
        with:
          name: python-wasi
          path: apps/desktop/src-tauri/resources/python

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The Linux job never runs code the way the Mac app does. Here the runner's tests run on macOS,
  # signed like the app (ad-hoc, hardened runtime, Entitlements.plist), so a missing entitlement or
  # a macOS-only runner bug fails CI instead of crashing the app on Run.
  macos:
    name: macOS (runner under the app's signature)
    needs: python-wasi
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v8
        with:
          name: python-wasi
          path: apps/desktop/src-tauri/resources/python

      - name: Build the runner tests
        run: |
          BIN=$(cargo test -p codegym-runner --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "codegym_runner") | .executable')
          echo "BIN=$BIN" >> "$GITHUB_ENV"

      - name: Hardened runtime with the app's entitlements
        run: |
          codesign --force --sign - --options runtime \
            --entitlements apps/desktop/src-tauri/Entitlements.plist "$BIN"
          codesign -d --entitlements - "$BIN"
          "$BIN"

  # The Docker image: built the way `docker compose up` builds it, then every language's Two Sum
  # is submitted through the HTTP API.
  docker:
    name: Docker (compose build + smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker compose build
      - name: Start
        run: docker compose up -d
      - name: Smoke test
        run: scripts/docker-smoke.sh http://localhost:8080
      - name: Server log
        if: always()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes
