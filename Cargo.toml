[workspace]
resolver = "3"
members = ["crates/core", "crates/runner", "crates/service", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
codegym-core = { path = "crates/core" }
codegym-runner = { path = "crates/runner" }
codegym-service = { path = "crates/service" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
include_dir = "0.7"
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
