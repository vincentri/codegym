[package]
name = "codegym-desktop"
description = "CodeGym desktop app: practice interview problems offline with an AI mentor."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codegym_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
codegym-ai = { workspace = true, features = ["keychain"] }
codegym-core.workspace = true
codegym-runner.workspace = true
codegym-service.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"

[lints]
workspace = true
