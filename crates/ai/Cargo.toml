[package]
name = "codegym-ai"
description = "AI providers for CodeGym: OpenAI-compatible endpoints (Ollama, OpenCode Zen, custom) and Claude."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
codegym-core.workspace = true
futures-util = "0.3"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "time", "net", "io-util", "rt"] }
tokio-util = "0.7"

[features]
# Exposes `mock_server` for other crates' tests.
testing = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[lints]
workspace = true
