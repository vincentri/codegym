[package]
name = "codegym-runner"
description = "Runs solutions against test cases: JavaScript (Node.js or built-in QuickJS), Python (CPython on WebAssembly) and Go."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
codegym-core.workspace = true
oxc = { version = "0.153", features = ["transformer", "codegen", "semantic"] }
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
uuid.workspace = true
wait-timeout.workspace = true
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std", "parallel-compilation", "cache", "addr2line", "demangle"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p1"] }
which = "8"

[lints]
workspace = true
