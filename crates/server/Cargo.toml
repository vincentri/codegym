[package]
name = "codegym-server"
description = "CodeGym over HTTP: the same backend as the desktop app, for running in Docker and using it in a browser."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
codegym-core.workspace = true
codegym-ai.workspace = true
codegym-runner.workspace = true
codegym-service.workspace = true
axum = "0.8"
futures-util = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
codegym-ai = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
