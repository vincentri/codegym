# CodeGym in your browser:
#   docker compose up -d     then open http://localhost:8080
#   docker compose down      stops it; your progress stays in the codegym-data volume
services:
  codegym:
    build: .
    image: codegym:local
    restart: unless-stopped
    ports:
      # Only this computer can reach it: CodeGym has no login.
      - "127.0.0.1:${CODEGYM_PORT:-8080}:8080"
    volumes:
      - codegym-data:/data
    extra_hosts:
      # Lets the AI mentor reach Ollama on your computer at http://host.docker.internal:11434.
      - "host.docker.internal:host-gateway"

volumes:
  codegym-data:
